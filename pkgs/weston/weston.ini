[core]
backend=synapse
renderer=pixman
idle-time=0
shell=desktop-shell.so
xwayland=false

[keyboard]
keymap_layout=us,ru
keymap_options=grp:alt_shift_toggle

[shell]
cursor-theme=breeze_cursors
background-color=0xff172534
panel-color=0xee263b50
locking=false
animation=none

[launcher]
icon=/usr/share/weston/terminal.png
path=/bin/weston-terminal
