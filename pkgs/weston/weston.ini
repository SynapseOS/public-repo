[core]
backend=synapse
renderer=auto
idle-time=0
shell=desktop-shell.so
xwayland=false

[input-method]
path=

[keyboard]
keymap_layout=us,ru
keymap_options=grp:alt_shift_toggle

[shell]
clock-format=minutes-24h
cursor-theme=breeze_cursors
background-color=0xff172534
background-image=/usr/share/backgrounds/synapse/Desktop.png
background-type=scale-crop
panel-color=0xee263b50
locking=false
animation=none

[launcher]
icon=/usr/share/weston/synapse-logo.png
path=/bin/synapse-desktop
displayname=Applications

[launcher]
icon=/usr/share/weston/terminal.png
path=/bin/weston-terminal
displayname=Terminal

[launcher]
icon=/usr/share/weston/settings-icon.png
path=/bin/synapse-desktop --settings
displayname=Settings

[launcher]
icon=/usr/share/weston/home.png
path=/bin/synapse-files
displayname=Files

[launcher]
icon=/usr/share/weston/mindustry-icon.png
path=/bin/mindustry
displayname=Mindustry
