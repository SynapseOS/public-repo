// apt.conf: изолировать данные Debian от setup
// Автор: Елчинян Арен Артурович, 2026
// Архитектура: x86_64, ABI: synapse-x86_64-v1
// Подсистема: менеджер Debian-пакетов
// Первое изменение: 01.11.2026, последнее изменение: 01.11.2026
// Статус доступа: общедоступный

Dir::State::status "/etc/debian-apt/status";
Dir::Bin::dpkg "/usr/libexec/debian-apt/dpkg-blocked";
Dir::Log "/etc/debian-apt/log";
// PATH процесса dpkg: внутри chroot bootstrap-утилиты лежат в synapse-runtime/bin
DPkg::Path "/usr/lib/synapse-runtime/bin:/usr/libexec/debian-apt:/usr/sbin:/usr/bin:/sbin:/bin";
APT::Get::AllowUnauthenticated "false";
Acquire::AllowInsecureRepositories "false";
Acquire::AllowDowngradeToInsecureRepositories "false";
APT::Update::Error-Mode "any";
