# nginx.conf: базовая конфигурация HTTP для SynapseOS
# Автор: Елчинян Арен Артурович, 2026, архитектура x86_64, ABI synapse-x86_64-v1
# Подсистема: сетевые службы, первое изменение: 21.10.2026, последнее изменение: 21.10.2026
# Статус доступа: общедоступный
# Один цикл poll без epoll и рабочих потоков
user root;
master_process off;
daemon off;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx.log warn;
events {
    use poll;
    worker_connections 128;
    accept_mutex off;
}
http {
    default_type application/octet-stream;
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        text/plain txt md;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
    }
    access_log /var/log/nginx-access.log;
    sendfile off;
    keepalive_timeout 15;
    client_max_body_size 8m;
    server {
        listen 80;
        server_name localhost;
        root /var/www;
        index index.html;
        location / { }
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
        # Пример маршрута к серверному приложению
        # location /api/ { proxy_pass http://127.0.0.1:8080; }
    }
}

